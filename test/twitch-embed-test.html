<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Twitch embed status test</title>
<style>body{background:#071328;color:#e6eefc;font:14px/1.5 system-ui;padding:16px}#log{white-space:pre-wrap;font:12px ui-monospace,monospace;background:#0e2244;padding:10px;border-radius:8px}</style></head>
<body><h1>Twitch embed status test (not linked from the site)</h1>
<div id="player"></div><div id="log"></div>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
window.__log=[];const L=m=>{const s=new Date().toISOString().slice(11,19)+" "+m;__log.push(s);document.getElementById("log").textContent=__log.join("\n")};
L("script loaded: "+(typeof Twitch));
const p=new Twitch.Player("player",{channel:"sincityryd3r_702",width:400,height:300,muted:true,autoplay:false,parent:[location.hostname]});
const E=Twitch.Player;
[["READY",E.READY],["ONLINE",E.ONLINE],["OFFLINE",E.OFFLINE],["PLAY",E.PLAY],["PLAYING",E.PLAYING],["PAUSE",E.PAUSE],["ENDED",E.ENDED]].forEach(([n,ev])=>p.addEventListener(ev,()=>{let x="";try{x=" channel="+p.getChannel()+" ended="+p.getEnded()}catch(e){};L("EVENT "+n+x)}));
</script></body></html>
